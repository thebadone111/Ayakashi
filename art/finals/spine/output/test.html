<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spine Animation Test — l1</title>
<style>
  body { margin: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: white; }
  canvas { border: 1px solid #444; }
  .controls { margin-top: 16px; display: flex; gap: 12px; }
  button { padding: 8px 16px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #666; }
  button.active { background: #c0392b; }
  #status { margin-top: 8px; font-size: 12px; color: #aaa; }
</style>
</head>
<body>

<h2 style="margin-bottom:8px">Spine Test — l1</h2>
<canvas id="canvas" width="512" height="512"></canvas>
<div class="controls">
  <button onclick="play('l1_static')" id="btn_static">l1_static</button>
  <button onclick="play('l1')" id="btn_l1">l1 (win)</button>
</div>
<div id="status">Loading...</div>

<!-- Spine 4.1 Web Player runtime -->
<script src="https://unpkg.com/@esotericsoftware/spine-webgl@4.1.23/dist/iife/spine-webgl.js"></script>

<script>
const ATLAS_URL = './converted/l1.atlas';
const JSON_URL  = './converted/l1.json';

let canvas, gl, renderer, assetManager, skeleton, animState, lastTime;
let currentAnim = 'l1_static';

function init() {
  canvas = document.getElementById('canvas');
  gl = canvas.getContext('webgl', { alpha: true });
  if (!gl) { status('WebGL not supported'); return; }

  renderer  = new spine.SceneRenderer(canvas, gl);
  assetManager = new spine.AssetManager(gl, '');

  assetManager.loadTextureAtlas(ATLAS_URL);
  assetManager.loadJson(JSON_URL);

  requestAnimationFrame(load);
}

function load() {
  if (!assetManager.isLoadingComplete()) {
    if (assetManager.hasErrors()) {
      status('ERROR: ' + JSON.stringify(assetManager.getErrors()));
      return;
    }
    requestAnimationFrame(load);
    return;
  }

  const atlas    = assetManager.require(ATLAS_URL);
  const jsonData = assetManager.require(JSON_URL);

  const atlasLoader = new spine.AtlasAttachmentLoader(atlas);
  const skeletonJson = new spine.SkeletonJson(atlasLoader);
  skeletonJson.scale = 0.5; // scale down to fit 512px canvas

  const skeletonData = skeletonJson.readSkeletonData(jsonData);
  skeleton = new spine.Skeleton(skeletonData);
  skeleton.x = canvas.width / 2;
  skeleton.y = canvas.height / 2;

  const animStateData = new spine.AnimationStateData(skeletonData);
  animState = new spine.AnimationState(animStateData);

  // List available animations
  const anims = skeletonData.animations.map(a => a.name);
  status('Loaded ✓  Animations: ' + anims.join(', '));

  play('l1_static');
  lastTime = Date.now() / 1000;
  requestAnimationFrame(render);
}

function play(animName) {
  if (!animState) return;
  currentAnim = animName;
  const loop = animName === 'l1_static';
  animState.setAnimation(0, animName, loop);

  // Highlight active button
  document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('btn_' + animName.replace('l1', 'l1').replace('_static','_static'));
  if (btn) btn.classList.add('active');
}

function render() {
  const now   = Date.now() / 1000;
  const delta = now - lastTime;
  lastTime = now;

  gl.clearColor(0.1, 0.1, 0.18, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  renderer.begin();
  animState.update(delta);
  animState.apply(skeleton);
  skeleton.updateWorldTransform();
  renderer.drawSkeleton(skeleton, true);
  renderer.end();

  requestAnimationFrame(render);
}

function status(msg) {
  document.getElementById('status').textContent = msg;
}

init();
</script>
</body>
</html>
