<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- Yuji Syuku (brush style), Latin+currency subset, locally hosted —
		     Stake requires no external font CDNs. Preloaded so PIXI Text never
		     renders with the fallback face. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/YujiSyuku-Subset.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<!-- NinjaKage removed 2026-07-03: demo face with no commercial licence.
		     All display + text rendering uses Yuji Syuku (OFL). -->
		<style>
			@font-face {
				font-family: 'Yuji Syuku';
				src: url('%sveltekit.assets%/fonts/YujiSyuku-Subset.woff2') format('woff2');
				/* swap (not block): if the face is slow/unavailable, show a fallback
				   rather than INVISIBLE text — a win amount must never be blank. */
				font-display: swap;
			}
		</style>
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; background-color: black">
		<div>%sveltekit.body%</div>
	</body>
</html>
